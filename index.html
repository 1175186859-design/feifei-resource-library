<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>大环境不好刷到什么就学点什么吧.JPG</title>

  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --line: #e5e7eb;
      --main: #111827;
      --soft: #f3f4f6;
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 66px 24px 38px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 18px;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1.05;
      letter-spacing: -2px;
      font-weight: 800;
    }

    header p {
      margin: 0 auto;
      max-width: 1100px;
      color: var(--muted);
      font-size: clamp(20px, 3vw, 34px);
      line-height: 1.45;
      font-weight: 600;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 60px;
    }

    .notice {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 20px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .search {
      flex: 1;
      min-width: 240px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 15px;
      background: #fff;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .category-btn {
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .category-btn.active {
      background: var(--main);
      color: #fff;
      border-color: var(--main);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .card.request {
      border: 1px dashed #9ca3af;
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
    }

    .tag {
      display: inline-block;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: #374151;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .drive {
      display: inline-block;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      margin-left: 6px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.4;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .code {
      color: var(--main);
      font-weight: 700;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: var(--main);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn.secondary {
      background: var(--blue);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 50px 20px;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 24px;
      padding: 36px 20px 56px;
      font-weight: 500;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      header {
        padding-top: 44px;
      }

      header h1 {
        font-size: 40px;
      }

      header p {
        font-size: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        display: block;
      }

      .search {
        width: 100%;
        margin-bottom: 14px;
      }

      footer {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Feifei Resource Library</h1>
    <p>资深牛马的资料库 - 不爱冲咖啡的纹身师不是一个及格的跨境人</p>
  </header>

  <main class="container">
    <div class="notice">
      资源建议先保存到自己的网盘后再查看。没有找到想要的资源，可以使用页面里的“求资源”入口。
    </div>

    <div class="toolbar">
      <input
        class="search"
        id="searchInput"
        placeholder="搜索资源，比如 Amazon、TikTok、Python、电影、书籍..."
      />
    </div>

    <div class="categories" id="categoryList"></div>

    <div class="status-bar">
      <div id="resourceCount">正在读取资源...</div>
      <div>数据来源：Google Sheet 自动同步</div>
    </div>

    <section class="grid" id="resourceGrid">
      <div class="empty">正在加载资源，请稍等...</div>
    </section>
  </main>

  <footer>
    © 2026 ZFF Resource Library. Curated with peace&love.
  </footer>

  <script>
    const SHEET_ID = "1H6t9EZYgY0rhE4gCs2M2JEm2I0fuW7mXNA1Cm6XpVSI";

    // 以后你做了“求资源表单”，把这里的 # 换成表单链接
    const REQUEST_LINK = "#";

    let resources = [];
    let currentCategory = "全部";

    const grid = document.getElementById("resourceGrid");
    const categoryList = document.getElementById("categoryList");
    const searchInput = document.getElementById("searchInput");
    const resourceCount = document.getElementById("resourceCount");

    function getCellValue(cell) {
      if (!cell) return "";
      return String(cell.v ?? cell.f ?? "").trim();
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(value);
    }

    function isIndexLike(value) {
      return /^\d+$/.test(value);
    }

    function isHeaderLike(value) {
      const headers = [
        "Unnamed: 0",
        "Unnamed: 1",
        "平台",
        "分类",
        "名称",
        "书名",
        "链接",
        "链接（所有资料先保存再查看）"
      ];
      return headers.includes(value);
    }

    function detectDrive(link) {
      if (link.includes("pan.baidu.com")) return "百度网盘";
      if (link.includes("pan.quark.cn")) return "夸克网盘";
      if (link.includes("aliyundrive")) return "阿里云盘";
      if (link.includes("lanzou")) return "蓝奏云";
      return "网盘/外部链接";
    }

    function extractCode(link) {
      const match = link.match(/[?&]pwd=([^&]+)/i);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function detectType(category, drive) {
      if (["电影", "电视剧", "纪录片", "影视"].includes(category)) return "影视资源";
      if (category === "书籍") return "书籍资源";
      if (drive.includes("网盘")) return "网盘资源";
      return "资源";
    }

    function normalizeCategory(category, title) {
      if (category) return category;
      if (title.includes("电影") || title.includes("纪录片") || title.includes("剧")) return "影视";
      return "书籍";
    }

    function parseSheetRows(rows) {
      const parsed = [];

      rows.forEach(row => {
        const values = (row.c || []).map(getCellValue);
        const linkIndex = values.findIndex(isUrl);

        if (linkIndex === -1) return;

        const link = values[linkIndex];

        const beforeLink = values
          .slice(0, linkIndex)
          .map(v => v.trim())
          .filter(v => v)
          .filter(v => !isIndexLike(v))
          .filter(v => !isHeaderLike(v));

        if (beforeLink.length === 0) return;

        const title = beforeLink[beforeLink.length - 1];
        let category = beforeLink.length >= 2 ? beforeLink[beforeLink.length - 2] : "";

        category = normalizeCategory(category, title);

        const drive = detectDrive(link);
        const code = extractCode(link);
        const type = detectType(category, drive);

        parsed.push({
          title,
          category,
          type,
          description: `「${title}」相关资源，建议先保存到自己的网盘后再查看。`,
          tags: [category, drive, type],
          drive,
          link,
          code,
          status: "可获取",
          updated: "自动同步",
          isRequest: false
        });
      });

      return parsed;
    }

    function addRequestCard(list) {
      return [
        {
          title: "没有找到想要的资源？",
          category: "求资源",
          type: "需求提交",
          description: "提交你想找的资源名称或关键词，我会根据情况补充到资源库里。",
          tags: ["求资源", "补档", "申请"],
          drive: "",
          link: REQUEST_LINK,
          code: "",
          status: "可提交",
          updated: "长期有效",
          isRequest: true
        },
        ...list
      ];
    }

    async function loadSheetData() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0`;
        const response = await fetch(url);
        const text = await response.text();

        const jsonText = text.substring(
          text.indexOf("(") + 1,
          text.lastIndexOf(")")
        );

        const data = JSON.parse(jsonText);
        const rows = data.table.rows || [];

        resources = addRequestCard(parseSheetRows(rows));

        renderCategories();
        renderResources();
      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="empty">
            资源读取失败。<br>
            请确认 Google Sheet 已设置为“知道链接的任何人可查看”，然后稍后刷新页面。
          </div>
        `;
        resourceCount.textContent = "资源读取失败";
      }
    }

    function getCategories() {
      return ["全部", ...new Set(resources.map(item => item.category))];
    }

    function renderCategories() {
      const categories = getCategories();

      categoryList.innerHTML = categories.map(category => `
        <button class="category-btn ${category === currentCategory ? "active" : ""}" data-category="${category}">
          ${category}
        </button>
      `).join("");

      document.querySelectorAll(".category-btn").forEach(button => {
        button.addEventListener("click", () => {
          currentCategory = button.dataset.category;
          renderCategories();
          renderResources();
        });
      });
    }

    function renderResources() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = resources.filter(item => {
        const matchCategory = currentCategory === "全部" || item.category === currentCategory;

        const matchKeyword =
          item.title.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword) ||
          item.type.toLowerCase().includes(keyword) ||
          item.description.toLowerCase().includes(keyword) ||
          item.drive.toLowerCase().includes(keyword) ||
          item.tags.join(" ").toLowerCase().includes(keyword);

        return matchCategory && matchKeyword;
      });

      const realResourceCount = Math.max(resources.length - 1, 0);
      resourceCount.textContent = `共 ${realResourceCount} 个资源，当前显示 ${filtered.length} 个`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">没有找到相关资源，可以试试换个关键词，或者提交求资源需求。</div>`;
        return;
      }

      grid.innerHTML = filtered.map((item, index) => `
        <article class="card ${item.isRequest ? "request" : ""}">
          <div>
            <div>
              <span class="tag">${item.category} · ${item.type}</span>
              ${item.drive ? `<span class="drive">${item.drive}</span>` : ""}
            </div>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            <div class="meta">
              状态：${item.status}<br>
              ${item.code ? `提取码：<span class="code">${item.code}</span><br>` : ""}
              标签：${item.tags.join(" / ")}<br>
              更新：${item.updated}
            </div>
          </div>
          <button class="btn ${item.isRequest ? "secondary" : ""}" data-link="${encodeURIComponent(item.link)}" data-request="${item.isRequest}">
            ${item.isRequest ? "提交需求" : "获取资源"}
          </button>
        </article>
      `).join("");

      document.querySelectorAll(".btn").forEach(button => {
        button.addEventListener("click", () => {
          const link = decodeURIComponent(button.dataset.link || "");
          const isRequest = button.dataset.request === "true";

          if (!link || link === "#") {
            if (isRequest) {
              alert("求资源表单还没有配置。后续可以接入飞书表单、Google Form 或腾讯问卷。");
            } else {
              alert("这个资源暂时还没有配置链接。");
            }
            return;
          }

          window.open(link, "_blank");
        });
      });
    }

    searchInput.addEventListener("input", renderResources);

    loadSheetData();
  </script>
</body>
</html>
